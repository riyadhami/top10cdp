[project]
name = "ecominsights"
version = "0.1.0"
description = "Upload ecommerce order CSVs (Shopify, Amazon, WooCommerce, generic) and get ranked, explained growth insights."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "plotly>=5.20",
    "rapidfuzz>=3.6",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "streamlit>=1.36",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "markdown>=3.6",
    "playwright>=1.45",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecominsights"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
